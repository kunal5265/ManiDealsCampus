<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - ManiDealsCampus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--header-height) + 2rem) 1rem 4rem;
    }
    .error-card {
      max-width: 500px;
      padding: 3.5rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--card-border);
    }
    .error-card h1 {
      font-size: 6rem;
      color: var(--secondary);
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    .error-card h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .error-card p {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>

  <div id="loader-wrapper">
    <div class="loader"></div>
  </div>

  <header></header>

  <main class="error-wrapper">
    <div class="error-card glass">
      <h1>404</h1>
      <h2>Classroom Not Found</h2>
      <p>The page you are looking for has graduated or has been relocated to another campus link.</p>
      
      <div style="display:flex; gap:15px; justify-content:center;">
        <a href="index.html" class="btn btn-primary">Go to Home</a>
        <a href="products.html" class="btn btn-secondary">Browse Deals</a>
      </div>
    </div>
  </main>

  <footer></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
