<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post product - ManiDealsCampus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="loader-wrapper">
    <div class="loader"></div>
  </div>

  <header></header>

  <main class="dashboard-wrapper">
    <div class="container dashboard-grid" style="grid-template-columns: 1fr;">
      
      <!-- Main Form -->
      <section class="db-main" style="max-width:800px; margin: 0 auto; width:100%;">
        <div class="db-header">
          <div>
            <h2 id="sell-page-title">Post Campus Deal</h2>
            <p>Create a product listing visible to students on your campus.</p>
          </div>
          <a href="dashboard.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="panel-card glass">
          <form id="sell-product-form">
            <div class="form-group">
              <label class="form-label" for="product-title">Item Title / Heading</label>
              <div class="input-wrapper">
                <input type="text" id="product-title" class="input-control" placeholder="e.g. Hero Sprint 21-Speed Gear Cycle" required>
                <i class="fas fa-tag"></i>
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="product-category">Category</label>
                <div class="input-wrapper">
                  <select id="product-category" class="input-control" style="padding-left: 48px;" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="Books">Books</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Hostel Essentials">Hostel Essentials</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Cycles">Cycles</option>
                    <option value="Sports">Sports</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Lab Equipment">Lab Equipment</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Others">Others</option>
                  </select>
                  <i class="fas fa-th-large"></i>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="product-price">Price (₹ INR)</label>
                <div class="input-wrapper">
                  <input type="number" id="product-price" class="input-control" placeholder="e.g. 1500" required min="0">
                  <i class="fas fa-indian-rupee-sign"></i>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="product-desc">Item Description</label>
              <textarea id="product-desc" class="input-control" style="height: 150px; padding: 12px; resize: vertical;" placeholder="Provide details like purchase date, items condition, dimensions, inclusion accessories, etc." required></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
              <label class="form-label" for="product-images">Upload Product Images (Max 5)</label>
              <div class="input-wrapper">
                <input type="file" id="product-images" class="input-control" style="padding: 10px 48px;" accept="image/*" multiple>
                <i class="fas fa-images"></i>
              </div>
              <p style="color:var(--text-muted); font-size:0.8rem; margin-top:5px;">Select multiple files together. First image becomes the cover photo.</p>
              
              <!-- Existing Image pre-views -->
              <div id="existing-preview-images" style="margin-top:1.5rem;"></div>
            </div>

            <button type="submit" class="btn btn-primary" id="sell-submit-btn" style="width: 100%; padding: 1rem; font-size: 1.1rem;">Post Product</button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <footer></footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/sell.js"></script>
</body>
</html>
