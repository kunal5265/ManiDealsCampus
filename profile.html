<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - ManiDealsCampus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="loader-wrapper">
    <div class="loader"></div>
  </div>

  <header></header>

  <main class="dashboard-wrapper">
    <div class="container dashboard-grid">
      
      <!-- Sidebar -->
      <aside class="db-sidebar">
        <div class="db-profile-card glass">
          <div class="profile-avatar-wrapper">
            <img class="profile-avatar" id="db-user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Avatar">
          </div>
          <h3 id="db-user-name">Loading...</h3>
          <span class="profile-tag" id="db-user-tag">Student Member</span>
        </div>

        <nav class="db-nav glass">
          <a href="dashboard.html" class="db-nav-link"><i class="fas fa-columns"></i> Dashboard</a>
          <a href="exchange.html" class="db-nav-link"><i class="fas fa-sync-alt"></i> Exchanges</a>
          <a href="wishlist.html" class="db-nav-link"><i class="fas fa-heart"></i> Wishlist</a>
          <a href="profile.html" class="db-nav-link active"><i class="fas fa-user-edit"></i> Edit Profile</a>
        </nav>
      </aside>

      <!-- Main Column Profile Form -->
      <section class="db-main">
        <div class="db-header">
          <div>
            <h2>Profile Settings</h2>
            <p>Update your campus credentials and contact information</p>
          </div>
        </div>

        <div class="panel-card glass">
          <div style="display:flex; align-items:center; gap:24px; margin-bottom:2rem; border-bottom:1px solid var(--card-border); padding-bottom:1.5rem;">
            <div style="position:relative; width:90px; height:90px;">
              <img id="profile-avatar-preview" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" style="width:100%; height:100%; border-radius:50%; object-fit:cover; border: 2px solid var(--secondary);" alt="Avatar">
              <label for="avatar-file-input" style="position:absolute; bottom:0; right:0; background:var(--secondary); color:#fff; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.75rem; border:2px solid var(--card-bg);" title="Upload Photo">
                <i class="fas fa-camera"></i>
              </label>
              <input type="file" id="avatar-file-input" style="display:none;" accept="image/*">
            </div>
            <div>
              <h3>Profile Image</h3>
              <p style="color:var(--text-muted); font-size:0.85rem;">Upload a square photo to identify yourself to sellers and buyers on campus.</p>
            </div>
          </div>

          <form id="profile-edit-form">
            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="profile-name">Full Name</label>
                <div class="input-wrapper">
                  <input type="text" id="profile-name" class="input-control" required>
                  <i class="fas fa-user"></i>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="profile-phone">Phone Number</label>
                <div class="input-wrapper">
                  <input type="tel" id="profile-phone" class="input-control" required>
                  <i class="fas fa-phone"></i>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="profile-email">College Email Address (Immutable)</label>
              <div class="input-wrapper">
                <input type="email" id="profile-email" class="input-control" disabled style="opacity:0.6; cursor:not-allowed;">
                <i class="fas fa-envelope"></i>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="profile-college">College / University</label>
              <div class="input-wrapper">
                <select id="profile-college" class="input-control" style="padding-left: 48px;" required>
                  <option value="Manipal Institute of Technology">Manipal Institute of Technology (MIT)</option>
                  <option value="Kasturba Medical College">Kasturba Medical College (KMC)</option>
                  <option value="Manipal College of Dental Sciences">Manipal College of Dental Sciences</option>
                  <option value="TAPMI">TAPMI Manipal</option>
                  <option value="Sikkim Manipal University">Sikkim Manipal University</option>
                  <option value="Other Campus">Other / Partner Institute</option>
                </select>
                <i class="fas fa-university"></i>
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="profile-dept">Department / Stream</label>
                <div class="input-wrapper">
                  <input type="text" id="profile-dept" class="input-control" required>
                  <i class="fas fa-graduation-cap"></i>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="profile-year">Academic Year</label>
                <div class="input-wrapper">
                  <select id="profile-year" class="input-control" style="padding-left: 48px;" required>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                    <option value="PG / Other">PG / Other</option>
                  </select>
                  <i class="fas fa-calendar-alt"></i>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Save Changes</button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <footer></footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
