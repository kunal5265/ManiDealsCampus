<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exchange Portal - ManiDealsCampus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="loader-wrapper">
    <div class="loader"></div>
  </div>

  <header></header>

  <main class="dashboard-wrapper">
    <div class="container dashboard-grid">
      
      <!-- Sidebar -->
      <aside class="db-sidebar">
        <div class="db-profile-card glass">
          <div class="profile-avatar-wrapper">
            <img class="profile-avatar" id="db-user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Avatar">
          </div>
          <h3 id="db-user-name">Loading...</h3>
          <span class="profile-tag" id="db-user-tag">Student Member</span>
        </div>

        <nav class="db-nav glass">
          <a href="dashboard.html" class="db-nav-link"><i class="fas fa-columns"></i> Dashboard</a>
          <a href="exchange.html" class="db-nav-link active"><i class="fas fa-sync-alt"></i> Exchanges</a>
          <a href="wishlist.html" class="db-nav-link"><i class="fas fa-heart"></i> Wishlist</a>
          <a href="profile.html" class="db-nav-link"><i class="fas fa-user-edit"></i> Edit Profile</a>
        </nav>
      </aside>

      <!-- Main Columns -->
      <section class="db-main">
        <div class="db-header">
          <div>
            <h2>Exchange Requests</h2>
            <p>Track trades you proposed and accept or reject offers from other campus students</p>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2.5rem;">
          <!-- Received requests -->
          <div>
            <h3 style="margin-bottom:1.5rem; color:var(--primary); font-size:1.4rem;">Offers Received</h3>
            <div id="received-requests-list">
              <p style="color:var(--text-muted);">Fetching received proposals...</p>
            </div>
          </div>

          <!-- Sent requests -->
          <div>
            <h3 style="margin-bottom:1.5rem; color:var(--primary); font-size:1.4rem;">Offers Proposed</h3>
            <div id="sent-requests-list">
              <p style="color:var(--text-muted);">Fetching sent proposals...</p>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer></footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/exchange.js"></script>
</body>
</html>
